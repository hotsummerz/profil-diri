<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Canvas Background in Soft Fearnot Tint -->
  <rect width="400" height="400" fill="#F0F6FD" rx="12"/>
  
  <!-- Subtle Fearnot Blue Circular Spotlight Aura (Pantone 7453 C: #7BA6DE) -->
  <circle cx="200" cy="180" r="140" fill="#7BA6DE" opacity="0.22"/>
  <circle cx="200" cy="180" r="100" fill="#7BA6DE" opacity="0.32"/>
  <circle cx="200" cy="180" r="60" fill="#BED8F6" opacity="0.45"/>
  
  <!-- Torso / Shoulders in Deep Fearnot Navy (#1A3E6D) -->
  <path d="M100 370 C 100 295, 140 260, 200 260 C 260 260, 300 295, 300 370 Z" fill="#1A3E6D"/>
  
  <!-- Collar / Shirt Detail with Fearnot Blue Accent -->
  <path d="M175 260 L200 295 L225 260 Z" fill="#FFFFFF"/>
  <line x1="200" y1="295" x2="200" y2="355" stroke="#7BA6DE" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Neck -->
  <rect x="182" y="215" width="36" height="50" rx="6" fill="#E8D5C4"/>
  <path d="M182 225 C 192 235, 208 235, 218 225 L 218 240 C 208 246, 192 246, 182 240 Z" fill="#D9BFAB"/>

  <!-- Head -->
  <ellipse cx="200" cy="165" rx="55" ry="68" fill="#F3E5D8"/>

  <!-- Hair - Modern Clean Cut -->
  <path d="M145 155 C 142 120, 160 90, 200 88 C 240 86, 258 115, 255 155 C 245 125, 225 110, 190 112 C 165 114, 150 135, 145 155 Z" fill="#0F172A"/>
  
  <!-- Eyebrows -->
  <path d="M165 145 Q 178 140 188 144" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M212 144 Q 222 140 235 145" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="178" cy="156" r="3.5" fill="#0F172A"/>
  <circle cx="222" cy="156" r="3.5" fill="#0F172A"/>

  <!-- Minimalist Glasses in Fearnot Deep Slate -->
  <rect x="162" y="146" width="32" height="22" rx="6" stroke="#1A3E6D" stroke-width="2.5" fill="none"/>
  <rect x="206" y="146" width="32" height="22" rx="6" stroke="#1A3E6D" stroke-width="2.5" fill="none"/>
  <line x1="194" y1="156" x2="206" y2="156" stroke="#1A3E6D" stroke-width="2.5"/>
  <line x1="148" y1="153" x2="162" y2="155" stroke="#1A3E6D" stroke-width="2"/>
  <line x1="238" y1="155" x2="252" y2="153" stroke="#1A3E6D" stroke-width="2"/>

  <!-- Nose -->
  <path d="M198 165 L196 177 L204 177" stroke="#D9BFAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smile -->
  <path d="M188 195 Q 200 203 212 195" stroke="#7BA6DE" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Inner Hairline Border in Fearnot Border Tone -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="10.5" stroke="#BED8F6" stroke-width="1.5"/>
</svg>
